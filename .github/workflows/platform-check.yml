# Checks Weft on every OS and chip it supports: prebuilt terminal (node-pty) runtimes, macOS
# host integrations, and install/update. Called by CI (full) and Release; never runs on its own.
name: Platform check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, macos-15-intel]
        node: ["20", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies without end-user native compilation
        run: npm ci --workspaces --include-workspace-root --ignore-scripts
      - name: Exercise isolated vendor runtime and integrity checks
        run: node --test scripts/native-runtime.test.mjs scripts/release-manifest.test.mjs
      - name: Build installed bundles
        run: npm run build -w @aasis21/weft-extension
      - name: Exercise macOS host integrations
        if: runner.os == 'macOS'
        env:
          WEFT_NATIVE_MACOS_TEST: "1"
        run: >-
          node --test --test-concurrency=1
          extension/test/deviceClipboard.test.mjs
          extension/test/deviceKeepAwake.test.mjs
          extension/test/deviceTelemetry.test.mjs
          extension/test/spawn.test.mjs
          extension/test/controlCenter.test.mjs
      - name: Exercise installation and update transaction
        run: node --test extension/test/cliUpdate.test.mjs scripts/native-install.test.mjs
