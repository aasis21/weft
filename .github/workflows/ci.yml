name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-runtime:
    uses: ./.github/workflows/native-runtime.yml

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build and verify the local-testing APK
        run: |
          npm ci --workspaces --include-workspace-root
          npm run build:android -w @aasis21/weft-mobile
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify mobile/android/app/build/outputs/apk/debug/app-debug.apk

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci --workspaces --include-workspace-root

      - name: Verify workspace versions
        run: npm run check-version

      - name: Test all workspaces
        run: npm test

      - name: Type-check mobile tests
        run: npm run test:types -w @aasis21/weft-mobile

      - name: Extension relay loop (harness smoke)
        run: npm run harness -w @aasis21/weft-extension -- --auto

      - name: Dormant extension scale budget
        run: npm run test:dormant-scale -w @aasis21/weft-extension

      - name: Build production workspaces
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright journeys
        run: npm run test:e2e -w @aasis21/weft-mobile

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
