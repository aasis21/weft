name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-runtime:
    uses: ./.github/workflows/native-runtime.yml

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci --workspaces --include-workspace-root

      - name: Verify workspace versions
        run: npm run check-version

      - name: Test all workspaces
        run: npm test

      - name: Type-check mobile tests
        run: npm run test:types -w @aasis21/weft-mobile

      - name: Extension relay loop (harness smoke)
        run: npm run harness -w @aasis21/weft-extension -- --auto

      - name: Build production workspaces
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright journeys
        run: npm run test:e2e -w @aasis21/weft-mobile

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
