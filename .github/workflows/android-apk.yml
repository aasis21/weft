name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.apk.outputs.version }}
      sha256: ${{ steps.apk.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build unsigned Android release APK
        run: |
          npm ci --workspaces --include-workspace-root
          npm run check-version
          npm run build:android:release -w @aasis21/weft-mobile

      - name: Check APK metadata
        id: apk
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          build_dir="mobile/android/app/build/outputs/apk/release"
          metadata="$build_dir/output-metadata.json"
          jq -e --arg version "$version" \
            '.applicationId == "dev.aasis21.weft" and
             .elements[0].versionName == $version and
             .elements[0].versionCode == ($version | split(".") | map(tonumber) | reduce .[] as $part (0; . * 1000 + $part))' \
            "$metadata" > /dev/null
          apk="$RUNNER_TEMP/weft-$version-unsigned.apk"
          cp "$build_dir/app-release-unsigned.apk" "$apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          sha256sum "$apk" | cut -d ' ' -f 1 | sed 's/^/sha256=/' >> "$GITHUB_OUTPUT"

      - name: Upload unsigned build for the signing job
        uses: actions/upload-artifact@v7.0.2
        with:
          name: weft-unsigned
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: android-release
    concurrency: android-release
    permissions:
      contents: write
    steps:
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'

      - uses: actions/download-artifact@v8.0.2
        with:
          name: weft-unsigned
          path: ${{ runner.temp }}/unsigned

      - name: Sign and verify APK
        id: signed
        shell: bash
        env:
          WEFT_ANDROID_KEYSTORE_B64: ${{ secrets.WEFT_ANDROID_KEYSTORE_B64 }}
          WEFT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WEFT_ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.apk.outputs.version }}
          UNSIGNED_SHA256: ${{ needs.apk.outputs.sha256 }}
        run: |
          if [[ -z "$WEFT_ANDROID_KEYSTORE_B64" || -z "$WEFT_ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Set the two signing secrets in the android-release environment."
            exit 1
          fi
          [[ "$VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]
          [[ "$UNSIGNED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          unsigned="$RUNNER_TEMP/unsigned/weft-$VERSION-unsigned.apk"
          printf '%s  %s\n' "$UNSIGNED_SHA256" "$unsigned" | sha256sum --check
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -c -P 16 4 "$unsigned"

          umask 077
          keystore="$(mktemp "$RUNNER_TEMP/weft-keystore.XXXXXX")"
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$WEFT_ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore"
          unset WEFT_ANDROID_KEYSTORE_B64
          apk="$RUNNER_TEMP/weft-$VERSION-android.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-type PKCS12 \
            --ks-key-alias weft-android-test --ks-pass env:WEFT_ANDROID_KEYSTORE_PASSWORD \
            --out "$apk" "$unsigned"
          unset WEFT_ANDROID_KEYSTORE_PASSWORD
          cert="$("$tools/apksigner" verify --print-certs "$apk" | awk '/^Signer #[0-9]+ certificate SHA-256 digest:/ {print $NF}')"
          if [[ "$cert" != '63345b162ae008cc4587326e2bb2eee043813913929553886346dbb94ab5ec68' ]]; then
            echo "::error::The APK was not signed with Weft's established Android test key."
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          sha256sum "$apk" | cut -d ' ' -f 1 | sed 's/^/sha256=/' >> "$GITHUB_OUTPUT"

      - name: Publish the signed Android prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.apk.outputs.version }}
          APK: ${{ steps.signed.outputs.path }}
          APK_SHA256: ${{ steps.signed.outputs.sha256 }}
        run: |
          tag="android-test-v$VERSION"
          notes="$RUNNER_TEMP/android-release-notes.md"
          {
            echo '**Android test build.** Open the APK and tap Install or Update.'
            echo 'Updates from earlier signed Android test releases preserve app data and pairing.'
            echo 'Switching from an old debug APK may require one uninstall because its signing key is different.'
            echo
            echo "SHA-256: \`$APK_SHA256\`"
          } > "$notes"
          gh release create "$tag" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Weft $VERSION for Android (test build)" --notes-file "$notes"
          echo "### [Download Weft $VERSION for Android]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/$(basename "$APK"))" >> "$GITHUB_STEP_SUMMARY"
