name: Native terminal distribution

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, macos-15-intel]
        node: ["20", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies without end-user native compilation
        run: npm ci --workspaces --include-workspace-root --ignore-scripts
      - name: Exercise isolated vendor runtime and integrity checks
        run: node --test scripts/native-runtime.test.mjs scripts/release-manifest.test.mjs
      - name: Build installed bundles
        run: npm run build -w @aasis21/weft-extension
      - name: Exercise installation and update transaction
        run: node --test extension/test/cliUpdate.test.mjs scripts/native-install.test.mjs
