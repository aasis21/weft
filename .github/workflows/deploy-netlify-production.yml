name: Deploy Netlify Production

on:
  workflow_dispatch:

concurrency:
  group: netlify-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Verify release version
        run: npm run check-version

      - name: Run all unit and integration tests
        run: npm test

      - name: Install browser test runtimes
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser journeys
        run: npm run test:e2e -w @aasis21/weft-mobile

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Netlify CLI
        run: npm install --global netlify-cli@26.2.0

      - name: Publish production site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: bash ./ship.sh --site "$NETLIFY_SITE_ID"
